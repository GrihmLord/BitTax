name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: audit engine (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The audit core, the main-process modules and the verifiers have no
      # runtime dependencies, so this job needs no install. That keeps the
      # check guarding the money maths fast and independent of the registry.
      - name: Syntax, tests and verifiers
        run: npm run check

  desktop:
    name: desktop smoke test
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's
      # sandbox needs. BitTax always runs sandboxed, so allow them rather than
      # weakening the app to suit the runner.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Launch and drive the app
        run: xvfb-run -a npm run smoke
